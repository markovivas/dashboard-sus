<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Faça seu login — e-SUS APS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/login.css" />
</head>
<body class="corpo-login">
  <div class="login-split">
    <!-- ================= COLUNA ESQUERDA: FORMULÁRIO MINIMALISTA ================= -->
    <main class="col-form">
      <div class="form-container">
        <!-- Logo municipal discreta no topo -->
        <div class="logo-area">
          <img src="/img/logo.png" alt="Prefeitura de Três Corações" class="logo-img" />
        </div>

        <div id="loginAviso" class="login-aviso" hidden role="alert"></div>

        <form id="formLogin" class="form-minimal" autocomplete="off">
          <!-- 1. CAMPO CATEGORIA (ESTILO NOTCHED OUTLINE) -->
          <div class="campo-notched">
            <label for="selectCategoria">Categoria</label>
            <div class="input-box">
              <svg class="ic-campo" viewBox="0 0 24 24">
                <path d="M4 6h16V4H4c-1.1 0-2 .9-2 2v11H0v3h14v-3H4V6zm19 2h-6c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h6c.55 0 1-.45 1-1V9c0-.55-.45-1-1-1zm-1 10h-4v-7h4v7z"/>
              </svg>
              <select id="selectCategoria" required>
                <option value="" disabled selected>Carregando categorias…</option>
              </select>
            </div>
          </div>

          <!-- 2. CAMPO PROFISSIONAL / USUÁRIO -->
          <div class="campo-notched" id="campoUsuarioWrapper">
            <label for="inputBuscaUsuario">Profissional / Usuário</label>
            <div class="input-box">
              <svg class="ic-campo" viewBox="0 0 24 24">
                <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
              </svg>
              <input 
                type="text" 
                id="inputBuscaUsuario" 
                placeholder="Selecione uma categoria primeiro" 
                autocomplete="off" 
                disabled 
              />
              <button type="button" id="btnClearUsuario" class="btn-clear-input" hidden title="Trocar profissional">
                <svg viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
              </button>
            </div>
            <!-- Lista suspensa / dropdown moderno com fechamento automático -->
            <div id="listaDropdownUsuarios" class="dropdown-usuarios-flutuante" hidden></div>
            <input type="hidden" id="loginUsuarioSelecionado" value="" required />
          </div>

          <!-- 3. CAMPO SENHA -->
          <div class="campo-notched">
            <label for="inputSenha">Senha</label>
            <div class="input-box">
              <svg class="ic-campo" viewBox="0 0 24 24">
                <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
              </svg>
              <input 
                type="password" 
                id="inputSenha" 
                value="Senha@2026" 
                placeholder="sua senha" 
                required 
              />
              <button type="button" id="btnToggleSenha" class="btn-ic-olho" title="Exibir/Ocultar senha" aria-label="Exibir senha">
                <svg viewBox="0 0 24 24" id="icOlho">
                  <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                </svg>
              </button>
            </div>
          </div>

          <!-- LINHA DE OPÇÕES (LEMBRAR DE MIM / SENHA PADRÃO) -->
          <div class="linha-opcoes">
            <label class="check-lembrar">
              <input type="checkbox" id="checkLembrar" checked />
              <span>Lembrar de mim</span>
            </label>
            <button type="button" id="btnSenhaPadrao" class="link-senha-padrao" title="Preencher senha padrão">
              Senha padrão: <strong>Senha@2026</strong>
            </button>
          </div>

          <!-- BOTÃO ENTRAR -->
          <button type="submit" id="btnEntrar" class="btn-login-principal">
            <span class="btn-rotulo">Entrar</span>
            <div class="spinner-btn" hidden></div>
          </button>
        </form>

        <footer class="rodape-minimal">
          <span>e-SUS APS • Prefeitura de Três Corações</span>
        </footer>
      </div>
    </main>

    <!-- ================= COLUNA DIREITA: VISUAL / ILUSTRAÇÃO ================= -->
    <aside class="col-visual">
      <div class="visual-wrapper">
        <!-- Logo Oficial e-SUS APS -->
        <div class="ilustracao-box logo-esus-box">
          <img src="/img/e-sus-logo.png" alt="e-SUS APS" class="img-esus-logo" />
        </div>

        <!-- Texto objetivo e impactante -->
        <div class="visual-texto">
          <span class="visual-tag">Prefeitura Municipal de Três Corações</span>
          <h2 class="visual-titulo">A melhor experiência em monitoramento da APS.</h2>
          <p class="visual-subtitulo">Indicadores oficiais, metas de cofinanciamento e dados clínicos direto da base do e-SUS PEC.</p>
        </div>
      </div>
    </aside>
  </div>

  <script src="/login.js"></script>
</body>
</html>
